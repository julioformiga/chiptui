[package]
name = "chiptui"
version = "0.1.0"
edition = "2024"
description = "Terminal UI for embedded development workflows"
repository = "https://github.com/julioformiga/chiptui"
license = "MIT"
readme = "README.md"
keywords = ["embedded", "tui", "micropython", "zephyr", "esp32"]
categories = ["command-line-utilities", "embedded", "development-tools"]

[dependencies]
# The device serial monitor runs `mpremote repl`, which requires a real tty
# (it calls `termios.tcgetattr(stdin)` unconditionally) --- a plain pipe via
# `process::ProcessManager` makes it exit immediately. `portable-pty` opens a
# real PTY cross-platform (Linux/macOS `openpty`, Windows ConPTY), matching
# `SPEC.md`'s "architecture should remain portable to macOS and Windows".
portable-pty = "0.9.0"
# Crossterm is used through `ratatui::crossterm` rather than as a direct
# `use` anywhere in this crate, so the backend and the terminal driver can
# never drift apart --- but this line still names it, purely to turn on
# `use-dev-tty` (Cargo unifies it into the one crossterm `ratatui` already
# pulls in, at the same resolved version). Its *default* event source
# (`event/source/unix/mio.rs`) has a real, externally-reported bug: on a
# closed/EOF'd tty fd, `UnixInternalEventSource::try_read`'s inner read loop
# never breaks on `read_count == 0` or on a non-`WouldBlock`/`Interrupted`
# error, so it spins one thread at 100% CPU *forever* --- confirmed live
# against this exact binary (a controlling terminal torn out from under a
# running session pinned it at 96% CPU, unkillable except by `SIGKILL`,
# which bypasses `TerminalGuard`'s `Drop`/panic-hook restore entirely and is
# exactly how a user ends up with a shell stuck in raw mode with the Kitty
# keyboard protocol still enabled). `use-dev-tty` swaps in
# `event/source/unix/tty.rs`, whose equivalent loop does break on
# `read_count == 0`, so the same condition surfaces as a real `io::Error`
# from `draw`/`next_event` instead of an unrecoverable hang --- letting
# `run()`'s normal `Err(err) => break Err(err)` path reach `guard.restore()`.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
ratatui = "0.30.2"
# Backs the app-wide color theme (default: Tokyo Night, overridable via `[ui]
# theme` in the user config --- see settings.rs). `default-features = false`
# drops the crate's default `serde` feature: chiptui's config is a hand-rolled
# parser (settings.rs), so theme names round-trip as plain strings via
# `ThemeName`'s own `Display`/`FromStr`, no serde needed.
ratatui-themes = { version = "0.3.0", default-features = false }
# Local half of the content check: the device side is hashed by
# `mpremote fs sha256sum`, and std has no hashing to match it with.
sha2 = { version = "0.11.0", default-features = false }
# Log-pane timestamps read in the operator's local wall-clock time; std has no
# notion of the local UTC offset. `local-offset` reads it from the OS once at
# startup, before any other thread exists --- see `logs::LogStore` module docs
# for why that ordering matters (the lookup is unsound once the process is
# multi-threaded).
time = { version = "0.3", features = ["local-offset"] }
# The board/shield pickers' docs layer (`src/board_docs.rs`): the Zephyr board
# index and per-board pages are HTML, fetched from docs.zephyrproject.org by
# dedicated background threads (the `blocking` API --- no async runtime enters
# the app itself; the threads mirror `ProcessManager`'s reader threads).
# `scraper` reads the index cards, `html2text` flattens a board's doc page,
# and `image` + `ratatui-image` decode and render each board's picture inside
# the picker (the `crossterm` feature matches the ratatui backend).
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "rustls",
] }
scraper = "0.27"
html2text = "0.17"
# `default-features = false` drops two halves of `image`'s `default`, neither
# of which this crate can reach. `avif` is `dep:ravif` --- the AV1 *encoder*
# (`rav1e`, `av-scenechange`, `rayon`: 55 crates), and ChipTUI only ever
# decodes. AVIF *decoding* is the separate `avif-native` feature (`dav1d`, a
# system library), off then and off now, so nothing that worked stops working.
# `rayon` is parallel decode, which a single board photo on its own background
# thread does not need. `exr` goes for a third reason, measured rather than
# structural: OpenEXR is a film-compositing HDR format the Zephyr docs will
# never serve, and it is the most expensive of the optional formats by a wide
# margin --- 13.4s of the clean build's 310s of CPU, across six crates (`exr`,
# `pulp`, `half`, `lebe`, `bit_field`, `num-complex`). Every other default
# format stays: `load_from_memory`
# sniffs the bytes at runtime, so what is compiled in *is* what can be read,
# and a format the docs adopt later would fail silently as "no picture in the
# docs" rather than loudly.
image = { version = "0.25", default-features = false, features = [
  "bmp",
  "dds",
  "ff",
  "gif",
  "hdr",
  "ico",
  "jpeg",
  "png",
  "pnm",
  "qoi",
  "tga",
  "tiff",
  "webp",
] }
# Its own `default` carries `image-defaults = ["image/default"]`, which Cargo
# would unify straight back into the `avif` dropped above --- so the defaults
# come off here too, and the two the app actually uses are named. `chafa-dyn`
# is deliberately kept: it is what `Picker::halfblocks()` (main.rs's fallback
# when `from_query_stdio` finds no kitty/sixel/iTerm protocol, and
# `BoardDocs`' own default) renders through, and without it the board picture
# drops to primitive halfblocks. It costs no crates --- only a `pkg-config`
# build dependency on libchafa >= 1.8.0, which must be installed to build.
ratatui-image = { version = "11", default-features = false, features = [
  "crossterm",
  "chafa-dyn",
] }
# The Terminal tab is a real terminal emulator, not a line-oriented console:
# the user's own shell (zsh + powerlevel10k here) redraws its prompt with
# cursor motion, paints it in 256 colours and switches to the alternate
# screen for full-screen programs --- none of which `console::LineConsole`
# models (it edits one line and drops SGR). `vt100` is the cell grid and
# escape-sequence engine; `tui-term` maps a `vt100::Screen` onto a ratatui
# buffer with its colours intact (its own deps are `ratatui-core`/
# `ratatui-widgets`, the crates ratatui 0.30 is built from). Both are
# shared by the Terminal tab and interactive device Monitor; ordinary command
# output and semantic side captures keep `LineConsole`.
vt100 = "0.16.2"
tui-term = "0.3.4"

[target.'cfg(unix)'.dependencies]
# Cancelling a build command must kill the whole tree it spawned: `west`
# leaves helpers (cmake, the dashboard generator, the browser) running when
# only the direct child is signalled, so `Stop` reported the dashboard
# cancelled while it kept working in the background. std can put a child in
# its own process group (`CommandExt::process_group`) but has no API to
# signal a group --- `libc::kill(-pgid, SIGTERM/SIGKILL)` is that one call.
# Already in the tree transitively via portable-pty, so it costs no extra
# compile.
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
# The tree-kill tests ask "is this pid still alive?", which is the same
# `kill` call with signal 0. An integration test links the crate, not the
# crate's dependencies, so it needs its own entry --- and the alternative,
# probing `/proc/<pid>`, silently limits those tests to Linux.
libc = "0.2"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"

# Full debuginfo grows `target/` past ~7.8 GB of `.debug_info` on this
# crate, at which point the linker dies on 32-bit relocations with a
# *rotating* failing target. Line tables keep backtraces useful and settle
# `target/` around 3 GB.
[profile.dev]
debug = "line-tables-only"

# A dependency's debuginfo is never what a backtrace from this crate needs, and
# it is the bulk of what `target/` grows into. Dropping it keeps the crate's own
# line tables (the setting above) while sparing every dependency the cost of
# emitting, writing and linking symbols nothing here reads.
[profile.dev.package."*"]
debug = 0

[lints.clippy]
all = { level = "deny", priority = -1 }
